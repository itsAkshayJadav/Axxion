<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Axxion Favicon Options</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Arial, sans-serif;
        background: #050b16;
        color: #f8fbff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 40px;
        background:
          radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.18), transparent 28%),
          linear-gradient(180deg, #06101d 0%, #050b16 100%);
      }

      h1 {
        margin: 0 0 24px;
        font-size: 28px;
        letter-spacing: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
        gap: 18px;
        max-width: 980px;
      }

      .option {
        border: 1px solid rgba(125, 211, 252, 0.18);
        border-radius: 8px;
        padding: 18px;
        background: rgba(8, 14, 28, 0.72);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 16px;
      }

      img {
        display: block;
        image-rendering: auto;
      }

      .size-64 {
        width: 64px;
        height: 64px;
      }

      .size-32 {
        width: 32px;
        height: 32px;
      }

      .size-16 {
        width: 16px;
        height: 16px;
      }

      .label {
        margin-top: 14px;
        color: #c5d5ea;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h1>Axxion Favicon Options</h1>
    <main class="grid">
      <section class="option">
        <div class="row">
          <img class="size-64" src="./axxion-favicon-option-1.svg" alt="Option 1 at 64px">
          <img class="size-32" src="./axxion-favicon-option-1.svg" alt="Option 1 at 32px">
          <img class="size-16" src="./axxion-favicon-option-1.svg" alt="Option 1 at 16px">
        </div>
        <div class="label">Option 1: compact A monogram</div>
      </section>
      <section class="option">
        <div class="row">
          <img class="size-64" src="./axxion-favicon-option-2.svg" alt="Option 2 at 64px">
          <img class="size-32" src="./axxion-favicon-option-2.svg" alt="Option 2 at 32px">
          <img class="size-16" src="./axxion-favicon-option-2.svg" alt="Option 2 at 16px">
        </div>
        <div class="label">Option 2: linked double-X glyph</div>
      </section>
      <section class="option">
        <div class="row">
          <img class="size-64" src="./axxion-favicon-option-3.svg" alt="Option 3 at 64px">
          <img class="size-32" src="./axxion-favicon-option-3.svg" alt="Option 3 at 32px">
          <img class="size-16" src="./axxion-favicon-option-3.svg" alt="Option 3 at 16px">
        </div>
        <div class="label">Option 3: light badge mark</div>
      </section>
      <section class="option">
        <div class="row">
          <img class="size-64" src="./axxion-favicon-option-4.svg" alt="Option 4 at 64px">
          <img class="size-32" src="./axxion-favicon-option-4.svg" alt="Option 4 at 32px">
          <img class="size-16" src="./axxion-favicon-option-4.svg" alt="Option 4 at 16px">
        </div>
        <div class="label">Option 4: filled technical A</div>
      </section>
    </main>
  </body>
</html>
